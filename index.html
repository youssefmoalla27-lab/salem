<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GTA Tunisie — Web Edition</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Segoe UI',sans-serif; touch-action:none; }
  #c { display:block; width:100vw; height:100vh; }

  /* HUD */
  #hud { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }

  /* Radar */
  #radarCanvas { position:absolute; bottom:160px; left:20px; border:2px solid rgba(255,200,0,0.8); border-radius:6px; background:rgba(0,0,0,0.7); width:110px; height:110px; }

  /* Health */
  #health-wrap { position:absolute; bottom:135px; left:20px; width:110px; }
  #health-label { color:#fff; font-size:10px; letter-spacing:1px; margin-bottom:3px; text-shadow:1px 1px 2px #000; }
  #health-bar { height:8px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,200,0,0.6); border-radius:2px; overflow:hidden; }
  #health-fill { height:100%; width:100%; background:linear-gradient(90deg,#00ff88,#00cc66); transition:width .3s; }

  /* Speed */
  #speedometer { position:absolute; bottom:20px; right:20px; color:#fff; text-align:right; text-shadow:0 0 8px #ff6600; }
  #speed-val { font-size:36px; font-weight:900; line-height:1; }
  #speed-unit { font-size:12px; opacity:.7; letter-spacing:2px; }

  /* Wanted Stars */
  #wanted { position:absolute; top:12px; right:16px; display:flex; gap:4px; }
  .star { font-size:18px; color:#555; }
  .star.on { color:#ffd700; text-shadow:0 0 6px #ffd700; }

  /* Phone overlay */
  #phone-wrap { position:absolute; bottom:0; right:20px; transform:translateY(120%); transition:transform .4s cubic-bezier(.34,1.56,.64,1); pointer-events:auto; }
  #phone-wrap.open { transform:translateY(-20px); }
  #phone { width:180px; background:linear-gradient(145deg,#1a1a2e,#16213e); border-radius:22px; border:2px solid rgba(255,255,255,0.15); padding:14px; box-shadow:0 20px 60px rgba(0,0,0,0.8); }
  #phone-status { display:flex; justify-content:space-between; color:#fff; font-size:10px; margin-bottom:10px; opacity:.8; }
  #phone-time { font-size:22px; font-weight:700; color:#fff; text-align:center; margin-bottom:14px; }
  #phone-apps { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .app-btn { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:10px 4px; text-align:center; cursor:pointer; color:#fff; }
  .app-icon { font-size:22px; display:block; margin-bottom:3px; }
  .app-name { font-size:9px; opacity:.7; }

  /* Controls */
  #joystick-zone { position:absolute; bottom:20px; left:20px; width:110px; height:110px; pointer-events:auto; }
  #joystick-base { position:absolute; inset:0; border-radius:50%; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.25); }
  #joystick-knob { position:absolute; width:40px; height:40px; background:radial-gradient(circle, #fff, #ffcc00); border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); }
  #action-btns { position:absolute; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; pointer-events:auto; }
  .action-btn { width:60px; height:60px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.4); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; text-align:center; }
  
  /* Loading */
  #loading { position:fixed; inset:0; background:#0a0a0a; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .8s; }
  #loading-logo { font-size:42px; font-weight:900; color:#ffd700; }
  #loading-bar-wrap { width:200px; height:4px; background:#222; margin-top:20px; }
  #loading-bar { height:100%; width:0%; background:#ffd700; }
  #notif { position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#ffd700; padding:8px 20px; border-radius:20px; display:none; }
</style>
</head>
<body>

<div id="loading">
  <div id="loading-logo">GTA TUNISIE</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-tip" style="color:#888; margin-top:10px; font-size:12px;">Chargement...</div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <canvas id="radarCanvas" width="110" height="110"></canvas>
  <div id="health-wrap">
    <div id="health-label">❤ VIE</div>
    <div id="health-bar"><div id="health-fill"></div></div>
  </div>
  <div id="speedometer">
    <div id="speed-val">0</div>
    <div id="speed-unit">KM/H</div>
  </div>
  <div id="notif"></div>
</div>

<div id="phone-wrap">
  <div id="phone">
    <div id="phone-time">12:00</div>
    <div id="phone-apps">
      <div class="app-btn" id="app-mechano">🔧 Mécano</div>
      <div class="app-btn" id="app-radio">🎵 Radio</div>
    </div>
  </div>
</div>

<div id="joystick-zone"><div id="joystick-base"></div><div id="joystick-knob"></div></div>
<div id="action-btns">
  <div class="action-btn" id="btn-phone">TEL</div>
  <div class="action-btn" id="btn-action">ACTION</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const canvas = document.querySelector('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1); // Optimisation iPhone 8
renderer.setClearColor(0x87CEEB);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 10, 20);

const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(10, 20, 10);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x404040, 0.6));

// Sol
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshLambertMaterial({color: 0x3a7a2a}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// STADE CORRIGÉ (EllipseGeometry remplacée par CircleGeometry scalée)
function buildStadium() {
  const g = new THREE.Group();
  const pitch = new THREE.Mesh(
    new THREE.CircleGeometry(1, 32), 
    new THREE.MeshLambertMaterial({color: 0x2d8a2d})
  );
  pitch.rotation.x = -Math.PI/2;
  pitch.scale.set(18, 13, 1); // Voici l'ellipse
  pitch.position.y = 0.1;
  g.add(pitch);
  scene.add(g);
}
buildStadium();

// Voiture simple pour le test
const car = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshStandardMaterial({color: 0x1a1a1a}));
car.position.set(5, 0.5, 5);
scene.add(car);

// Logic de chargement
let loadPct = 0;
const loadBar = document.getElementById('loading-bar');
const interval = setInterval(() => {
  loadPct += 5;
  loadBar.style.width = loadPct + '%';
  if(loadPct >= 100) {
    clearInterval(interval);
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      animate();
    }, 800);
  }
}, 100);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
